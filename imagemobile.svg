<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <defs>
    <filter id="glow-m" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="m-book1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#EE4444"/>
    </linearGradient>
    <linearGradient id="m-book2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECDC4"/><stop offset="100%" stop-color="#2BB5AC"/>
    </linearGradient>
    <linearGradient id="m-book3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE66D"/><stop offset="100%" stop-color="#F0D050"/>
    </linearGradient>
    <linearGradient id="m-book4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8E6CF"/><stop offset="100%" stop-color="#7DD4A8"/>
    </linearGradient>
    <linearGradient id="m-book5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A0E8"/><stop offset="100%" stop-color="#A87DD4"/>
    </linearGradient>
    <linearGradient id="m-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/><stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
  </defs>

  <!-- Shelf brackets -->
  <rect x="4" y="10" width="2" height="26" rx="1" fill="#FFFFFF" opacity="0.55"/>
  <rect x="38" y="10" width="2" height="26" rx="1" fill="#FFFFFF" opacity="0.55"/>

  <!-- Shelf base -->
  <rect x="4" y="34" width="36" height="3" rx="1" fill="#FFFFFF" opacity="0.9"/>

  <!-- Books -->
  <!-- Book 1 - red tall -->
  <rect x="7"  y="13" width="5.5" height="21" rx="0.8" fill="url(#m-book1)"/>
  <rect x="7"  y="13" width="1.2" height="21" rx="0.4" fill="#FF9999" opacity="0.45"/>

  <!-- Book 2 - teal mid -->
  <rect x="13.5" y="17" width="5" height="17" rx="0.8" fill="url(#m-book2)"/>

  <!-- Book 3 - yellow short -->
  <rect x="19.5" y="21" width="4" height="13" rx="0.8" fill="url(#m-book3)"/>

  <!-- Book 4 - green tall -->
  <rect x="24.5" y="14" width="5.5" height="20" rx="0.8" fill="url(#m-book4)"/>
  <rect x="24.5" y="14" width="1.2" height="20" rx="0.4" fill="#C4F0DC" opacity="0.4"/>

  <!-- Book 5 - purple mid -->
  <rect x="31"  y="18" width="4.5" height="16" rx="0.8" fill="url(#m-book5)"/>

  <!-- Smart chip on top of red book -->
  <g transform="translate(7.5, 7)">
    <rect x="-1" y="0.5" width="6" height="4.5" rx="1.2" fill="url(#m-chip)" filter="url(#glow-m)"/>
    <!-- pins top -->
    <line x1="1"  y1="0.5" x2="1"  y2="-0.5" stroke="#00D4FF" stroke-width="0.7"/>
    <line x1="3"  y1="0.5" x2="3"  y2="-0.5" stroke="#00D4FF" stroke-width="0.7"/>
    <!-- pins left -->
    <line x1="-1" y1="1.8" x2="-2" y2="1.8" stroke="#00D4FF" stroke-width="0.65"/>
    <line x1="-1" y1="3.2" x2="-2" y2="3.2" stroke="#00D4FF" stroke-width="0.65"/>
    <!-- pins right -->
    <line x1="5"  y1="1.8" x2="6"  y2="1.8" stroke="#00D4FF" stroke-width="0.65"/>
    <line x1="5"  y1="3.2" x2="6"  y2="3.2" stroke="#00D4FF" stroke-width="0.65"/>
  </g>

  <!-- Glow dot under chip (light beam) -->
  <rect x="8" y="37" width="3" height="1.5" rx="0.5" fill="#FFD700" opacity="0.55"/>
</svg>