    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous">
    <link rel="stylesheet" href="mainstyle.css">
    <style>
       .pagination-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 50px 0;
    flex-wrap: wrap; /* Mobile မှာ ဆန့်အောင် */
}

.page-btn {
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    border: 1px solid #ddd;
    background: #fff;
    color: #333;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
    transition: all 0.2s;
}

.page-btn:hover:not(:disabled) {
    border-color: var(--primary-blue);
    color: var(--primary-blue);
}

.page-btn.active {
    background: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
}

.page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
        .sort-info {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--dark-blue);
        }
        /* Individual Book Card Skeleton */
.skeleton-card {
    background: #fff;
    pointer-events: none; /* Loading ဖြစ်နေစဉ် နှိပ်လို့မရအောင် */
}

.skeleton-img {
    width: 100%;
    aspect-ratio: 2/3; /* စာအုပ်ဆိုဒ်အတိုင်း */
    background: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 4px;
}

.skeleton-text {
    width: 80%;
    height: 15px;
    background: #eee;
    margin: 10px auto 5px;
    border-radius: 4px;
}

.skeleton-text.short {
    width: 50%;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.js" integrity="sha384-i0m00Vn1ERlKXxNWSa87g6OUB7eLxpmsQoNF68IHuQVtfJTebIca7XhFsYt9h/gN" crossorigin="anonymous"></script>
