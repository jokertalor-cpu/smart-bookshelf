<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52" width="280" height="52">
  <defs>
    <!-- Shelf glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Light beam -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <!-- Book spine gradients -->
    <linearGradient id="book1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#EE4444"/>
    </linearGradient>
    <linearGradient id="book2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#2BB5AC"/>
    </linearGradient>
    <linearGradient id="book3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#F0D050"/>
    </linearGradient>
    <linearGradient id="book4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#7DD4A8"/>
    </linearGradient>
    <linearGradient id="book5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A0E8"/>
      <stop offset="100%" stop-color="#A87DD4"/>
    </linearGradient>
    <!-- Smart chip gradient -->
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
  </defs>

  <!-- ═══ ICON GROUP ═══ -->
  <g transform="translate(4, 4)">

    <!-- Shelf base -->
    <rect x="0" y="34" width="46" height="3.5" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <!-- Shelf left bracket -->
    <rect x="0" y="10" width="2.5" height="27" rx="1" fill="#FFFFFF" opacity="0.6"/>
    <!-- Shelf right bracket -->
    <rect x="43.5" y="10" width="2.5" height="27" rx="1" fill="#FFFFFF" opacity="0.6"/>

    <!-- Books sitting on shelf -->
    <!-- Book 1 - tall red -->
    <rect x="4" y="12" width="7" height="22" rx="1" fill="url(#book1)"/>
    <rect x="4" y="12" width="1.5" height="22" rx="0.5" fill="#FF8888" opacity="0.5"/>

    <!-- Book 2 - medium teal -->
    <rect x="12.5" y="16" width="6" height="18" rx="1" fill="url(#book2)"/>
    <rect x="12.5" y="16" width="1.5" height="18" rx="0.5" fill="#7EEAE3" opacity="0.5"/>

    <!-- Book 3 - short yellow -->
    <rect x="19.5" y="20" width="5" height="14" rx="1" fill="url(#book3)"/>

    <!-- Book 4 - tall green -->
    <rect x="25.5" y="13" width="7" height="21" rx="1" fill="url(#book4)"/>
    <rect x="25.5" y="13" width="1.5" height="21" rx="0.5" fill="#C4F0DC" opacity="0.5"/>

    <!-- Book 5 - medium purple -->
    <rect x="33.5" y="17" width="6" height="17" rx="1" fill="url(#book5)"/>
    <rect x="33.5" y="17" width="1.5" height="17" rx="0.5" fill="#DDB8F4" opacity="0.5"/>

    <!-- Smart chip / WiFi signal on top of tallest book -->
    <g transform="translate(5.5, 6)">
      <!-- Chip base -->
      <rect x="-2" y="1" width="8" height="5.5" rx="1.5" fill="url(#chipGrad)" filter="url(#glow)"/>
      <!-- Circuit lines -->
      <line x1="0.5" y1="1" x2="0.5" y2="0" stroke="#00D4FF" stroke-width="0.8"/>
      <line x1="3.5" y1="1" x2="3.5" y2="0" stroke="#00D4FF" stroke-width="0.8"/>
      <!-- Chip pins left -->
      <line x1="-2" y1="2.5" x2="-3.2" y2="2.5" stroke="#00D4FF" stroke-width="0.7"/>
      <line x1="-2" y1="4.5" x2="-3.2" y2="4.5" stroke="#00D4FF" stroke-width="0.7"/>
      <!-- Chip pins right -->
      <line x1="6" y1="2.5" x2="7.2" y2="2.5" stroke="#00D4FF" stroke-width="0.7"/>
      <line x1="6" y1="4.5" x2="7.2" y2="4.5" stroke="#00D4FF" stroke-width="0.7"/>
    </g>

    <!-- Light beam from chip -->
    <rect x="6.5" y="37.5" width="3" height="2" rx="0.5" fill="#FFD700" opacity="0.6"/>

  </g>
  <!-- ═══ TEXT GROUP ═══ -->
  <g transform="translate(58, 0)">
    <!-- SMART - bold, tight, uppercase -->
    <text
      x="0" y="26"
      font-family="'Georgia', 'Times New Roman', serif"
      font-size="18"
      font-weight="700"
      letter-spacing="4"
      fill="#FFFFFF"
    >SMART</text>

    <!-- BOOKSHELF - lighter weight below -->
    <text
      x="1" y="42"
      font-family="'Georgia', 'Times New Roman', serif"
      font-size="13"
      font-weight="400"
      letter-spacing="6"
      fill="#FFFFFF"
      opacity="0.85"
    >BOOKSHELF</text>

    <!-- Decorative line between words -->
    <line x1="0" y1="30" x2="108" y2="30" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- ═══ PREVIEW: Blue navbar background ═══ -->
  <!-- (Remove this rect if embedding directly in real navbar) -->
</svg>